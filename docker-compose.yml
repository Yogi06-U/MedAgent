services:
  medagent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medagent
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - LLM_PROVIDER=offline
      - VECTOR_BACKEND=numpy
      - HF_HUB_OFFLINE=1
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./uploads:/app/uploads
    restart: unless-stopped
