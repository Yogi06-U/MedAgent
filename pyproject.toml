[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medagent"
version = "1.0.0"
description = "Multimodal multi-agent clinical decision-support research prototype"
readme = "README.md"
authors = [
    { name = "MedAgent Research Team" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "httpx>=0.27.0",
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "torchxrayvision>=1.2.0",
    "sentence-transformers>=3.0.0",
    "reportlab>=4.2.0",
    "pillow>=10.4.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "pdfplumber>=0.11.0",
    "pydicom>=2.4.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "playwright>=1.48.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
